# Cloudflare Pages configuration
name = "fluxion-frontend"
compatibility_date = "2024-09-01"

[build]
  command = "npm run build:static"
  destination = "out"

# Environment variables
[env.production]
  NEXT_PUBLIC_ENV = "production"
  NEXT_PUBLIC_FRONTEND_URL = "https://fluxion.pay"
  NEXT_PUBLIC_API_URL = "https://api.fluxion.pay"

[env.preview]
  NEXT_PUBLIC_ENV = "preview"
  NEXT_PUBLIC_FRONTEND_URL = "https://fluxion-preview.pages.dev"
  NEXT_PUBLIC_API_URL = "https://api-dev.fluxion.pay"