<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Project Proposal</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 100%); color: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; }
        .section { margin-bottom: 2rem; padding: 1.5rem; background: #f8f9fa; border-radius: 8px; }
        .section-title { color: #ff6b6b; font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; }
        .highlight { background: #fff3cd; border: 2px solid #ffc107; border-radius: 8px; padding: 1rem; text-align: center; margin: 1rem 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{project_title}}</h1>
        <p>Creative Project Proposal</p>
    </div>

    <div class="section">
        <h2 class="section-title">Creative Concept</h2>
        <p>{{creative_concept}}</p>
    </div>

    <div class="section">
        <h2 class="section-title">Design Approach</h2>
        <p>{{design_approach}}</p>
    </div>

    <div class="section">
        <h2 class="section-title">Deliverables</h2>
        <p>{{deliverables}}</p>
    </div>

    <div class="highlight">
        <h3>Total Investment: ${{total_value}}</h3>
    </div>
</body>
</html>
