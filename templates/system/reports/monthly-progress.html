<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Progress Report</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; }
        .section { margin-bottom: 2rem; padding: 1.5rem; background: #f8f9fa; border-radius: 8px; }
        .section-title { color: #6366f1; font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1rem 0; }
        .kpi-card { background: white; padding: 1rem; border-radius: 8px; text-align: center; border: 2px solid #6366f1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Monthly Progress Report</h1>
        <p>{{report_period}}</p>
    </div>

    <div class="section">
        <h2 class="section-title">Key Achievements</h2>
        <p>{{key_achievements}}</p>
    </div>

    <div class="section">
        <h2 class="section-title">KPI Metrics</h2>
        <div class="kpi-grid">
            {{#each kpis}}
            <div class="kpi-card">
                <h3>{{name}}</h3>
                <div style="font-size: 2rem; color: #6366f1; font-weight: bold;">{{value}}</div>
            </div>
            {{/each}}
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">Next Month Goals</h2>
        <p>{{next_month_goals}}</p>
    </div>
</body>
</html>
