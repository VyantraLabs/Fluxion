# SAM Configuration for Fluxion Microservices Deployment

version = 0.1

[default]
[default.global.parameters]
stack_name = "fluxion-microservices"
s3_bucket = "fluxion-deployments"
s3_prefix = "microservices"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = []
image_repositories = []

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
stack_name = "fluxion-microservices-dev"
s3_bucket = "fluxion-deployments-dev"
s3_prefix = "microservices/dev"
region = "us-east-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
disable_rollback = false
parameter_overrides = [
    "Environment=dev"
]
tags = [
    "Environment=dev",
    "Project=fluxion",
    "ManagedBy=SAM"
]

[default.package.parameters]
s3_bucket = "fluxion-deployments-dev"
s3_prefix = "microservices/dev"
region = "us-east-1"

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# Development Environment
[dev]
[dev.global.parameters]
stack_name = "fluxion-microservices-dev"
s3_bucket = "fluxion-deployments-dev"
s3_prefix = "microservices/dev"
region = "us-east-1"

[dev.deploy.parameters]
stack_name = "fluxion-microservices-dev"
s3_bucket = "fluxion-deployments-dev"
s3_prefix = "microservices/dev"
region = "us-east-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=dev",
    "DBHost={{resolve:ssm:/fluxion/dev/db-host}}",
    "DBUsername={{resolve:ssm:/fluxion/dev/db-username}}",
    "DBPassword={{resolve:ssm:/fluxion/dev/db-password}}",
    "DBDatabase={{resolve:ssm:/fluxion/dev/db-database}}",
    "JWTSecret={{resolve:ssm:/fluxion/dev/jwt-secret}}",
    "RedisHost={{resolve:ssm:/fluxion/dev/redis-host}}",
    "NotificationQueueUrl={{resolve:ssm:/fluxion/dev/notification-queue-url}}",
    "S3BucketName={{resolve:ssm:/fluxion/dev/s3-bucket}}"
]
tags = [
    "Environment=dev",
    "Project=fluxion",
    "ManagedBy=SAM"
]

# Staging Environment
[staging]
[staging.global.parameters]
stack_name = "fluxion-microservices-staging"
s3_bucket = "fluxion-deployments-staging"
s3_prefix = "microservices/staging"
region = "us-east-1"

[staging.deploy.parameters]
stack_name = "fluxion-microservices-staging"
s3_bucket = "fluxion-deployments-staging"
s3_prefix = "microservices/staging"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=staging",
    "DBHost={{resolve:ssm:/fluxion/staging/db-host}}",
    "DBUsername={{resolve:ssm:/fluxion/staging/db-username}}",
    "DBPassword={{resolve:ssm:/fluxion/staging/db-password}}",
    "DBDatabase={{resolve:ssm:/fluxion/staging/db-database}}",
    "JWTSecret={{resolve:ssm:/fluxion/staging/jwt-secret}}",
    "RedisHost={{resolve:ssm:/fluxion/staging/redis-host}}",
    "NotificationQueueUrl={{resolve:ssm:/fluxion/staging/notification-queue-url}}",
    "S3BucketName={{resolve:ssm:/fluxion/staging/s3-bucket}}"
]
tags = [
    "Environment=staging",
    "Project=fluxion",
    "ManagedBy=SAM"
]

# Production Environment
[production]
[production.global.parameters]
stack_name = "fluxion-microservices-production"
s3_bucket = "fluxion-deployments-production"
s3_prefix = "microservices/production"
region = "us-east-1"

[production.deploy.parameters]
stack_name = "fluxion-microservices-production"
s3_bucket = "fluxion-deployments-production"
s3_prefix = "microservices/production"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "Environment=production",
    "DBHost={{resolve:ssm:/fluxion/production/db-host}}",
    "DBUsername={{resolve:ssm:/fluxion/production/db-username}}",
    "DBPassword={{resolve:ssm:/fluxion/production/db-password}}",
    "DBDatabase={{resolve:ssm:/fluxion/production/db-database}}",
    "JWTSecret={{resolve:ssm:/fluxion/production/jwt-secret}}",
    "RedisHost={{resolve:ssm:/fluxion/production/redis-host}}",
    "NotificationQueueUrl={{resolve:ssm:/fluxion/production/notification-queue-url}}",
    "S3BucketName={{resolve:ssm:/fluxion/production/s3-bucket}}",
    "VpcSecurityGroupIds={{resolve:ssm:/fluxion/production/vpc-security-groups}}",
    "VpcSubnetIds={{resolve:ssm:/fluxion/production/vpc-subnets}}"
]
tags = [
    "Environment=production",
    "Project=fluxion",
    "ManagedBy=SAM",
    "CostCenter=Engineering",
    "Owner=FluxionTeam"
]